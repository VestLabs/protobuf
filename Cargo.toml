[package]
name = "pure_protobuf_rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "pure_protobuf_rust"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "rust_decimal"] }
rust_decimal = "1.36"
prost = "0.13"  # Use production-tested varint encoding from tokio stack
bytes = "1.8"   # Required for prost::encoding

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

